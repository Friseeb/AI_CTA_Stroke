name: aorta-cta-radiomics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - scikit-image
  - scikit-learn
  - simpleitk
  - nibabel
  - networkx>=3
  - pyyaml
  - typer
  - tqdm
  - matplotlib
  - seaborn
  - pytest
  - pip
  - pip:
      - --no-build-isolation
      - pyradiomics==3.0.1

# Optional, install only when needed:
#   conda install -c conda-forge vtk pyvista trimesh pyarrow
#   pip install monai torch
# Workspace packages are installed explicitly after environment creation:
#   pip install -e ../cta_common -e .[dev,table]
# On macOS, if torch reports duplicate OpenMP runtimes:
#   export KMP_DUPLICATE_LIB_OK=TRUE
